name: Telegram notification

on:
  push:
    branches:
      - main
    paths:
      - '**/submission-*.py'

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram message
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_SHA: ${{ github.sha }}
          COMMIT_URL: ${{ github.event.head_commit.url }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets are not configured. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID."
            exit 1
          fi

          MESSAGE="NeetCode solution pushed successfully!%0ARepository: ${REPO}%0ABranch: ${BRANCH}%0ACommit: ${COMMIT_MESSAGE}%0ACommit link: ${COMMIT_URL}"

          curl --fail --silent --show-error \
            --request POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=NeetCode solution pushed successfully!
Repository: ${REPO}
Branch: ${BRANCH}
Commit: ${COMMIT_MESSAGE}
Commit link: ${COMMIT_URL}"
